name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Run daily at 11 AM UTC.
    - cron: '0 11 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  rust-version:
    name: read Rust version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The host has substantial per-OS code, so lint and test it on each one.
  rust:
    name: Rust format, lint, and test (${{ matrix.os }})
    needs: rust-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    # Windows is not a supported target yet. Its legs run so we see when they
    # pass, but do not fail the run.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run host unit tests
        run: cargo test --locked --all-targets
      # The test helper (PTY and console runners for scripts/test.roc) is a
      # crate of its own, so the steps above do not cover it.
      - name: Check, lint and test the test helper
        shell: bash
        run: |
          cargo fmt --manifest-path tools/test-helper/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/test-helper/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/test-helper/Cargo.toml

  validate:
    name: validate sources
    needs: rust-version
    runs-on: ubuntu-24.04
    # Generous enough to build the pinned Roc on a cold cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.17.1
      - uses: niclas-ahden/roc-builds@065946819a3c3aafefd5974b9109adeecbad8106 # v1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target x86_64-unknown-linux-musl --target x86_64-pc-windows-msvc --component llvm-tools-preview --component rust-docs
          rustup default "${{ needs.rust-version.outputs.version }}"
      # The modules (Targets.roc, HostBuild.roc ...) are tested through the scripts
      # that import them.
      # The Windows legs may fail without failing the run, so the Windows side
      # of the test helper is at least compiled here, where a failure counts.
      - name: Compile the test helper for Windows
        run: cargo check --locked --manifest-path tools/test-helper/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Test the scripts
        run: |
          set -euo pipefail
          for script in scripts/[a-z]*.roc ci/*.roc; do
            roc test "$script"
          done
      # Builds the Windows runtime inputs with Zig and checks provenance, the
      # bundle and the compiler adapter, which all run on Linux.
      - name: Test the Windows runtime tooling
        run: roc scripts/test_windows_runtime.roc
      - name: Check third-party notices are current
        run: roc scripts/third_party_notices.roc --check
      - name: Check Roc pins are in sync
        run: roc scripts/check_roc_pin.roc
      - name: Read pinned Roc commit
        id: roc-pin
        run: echo "sha=$(jq -r '.nodes["roc-src"].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned Roc glue spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: roc-lang/roc
          ref: ${{ steps.roc-pin.outputs.sha }}
          path: .roc-glue-src
          sparse-checkout: src/glue
      - name: Check the generated glue is current
        run: ROC_SRC=.roc-glue-src ci/regenerate_glue.sh --check
      - name: Check OS witness API boundaries
        run: roc scripts/test_system_api.roc
      - name: Format, check, and test examples
        run: roc scripts/test.roc --operation validate
      - name: Check musl allocator syscall churn
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          roc scripts/test_musl_allocator.roc
      - name: Check native resource ownership with glibc and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          roc scripts/test_resource_lifetimes.roc

  validate-windows:
    name: validate sources (windows)
    needs: rust-version
    runs-on: windows-2025
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.17.1
      - uses: niclas-ahden/roc-builds@065946819a3c3aafefd5974b9109adeecbad8106 # v1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target x86_64-pc-windows-msvc --component rust-docs,llvm-tools-preview
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Format, check, and test examples
        shell: bash
        run: roc scripts/test.roc --operation validate
      - name: Verify Windows runtime ABI and redistribution evidence
        shell: bash
        run: |
          roc scripts/build.roc --target x64win
          roc scripts/windows_runtime.roc --test-windows

  build-examples:
    name: build examples (${{ matrix.target }})
    needs: [rust-version, validate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-26-intel
            rust_target: x86_64-apple-darwin
          - target: arm64mac
            os: macos-26
            rust_target: aarch64-apple-darwin
          - target: x64musl
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - target: arm64musl
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: x64win
            os: windows-2025
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.target == 'x64win' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.17.1
      - uses: niclas-ahden/roc-builds@065946819a3c3aafefd5974b9109adeecbad8106 # v1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target ${{ matrix.rust_target }} --component rust-docs,llvm-tools-preview
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Install LLVM tools for Linux host stripping
        if: endsWith(matrix.target, 'musl')
        run: rustup component add llvm-tools-preview
      - name: Cross-compile every example
        shell: bash
        run: roc scripts/test.roc --operation build --target "${{ matrix.target }}" --artifact-dir dist/example-binaries
      - name: Upload example binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}
          if-no-files-found: error

  run-examples:
    name: run examples (${{ matrix.target }})
    needs: [rust-version, build-examples]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-26-intel
            valgrind: false
          - target: arm64mac
            os: macos-26
            valgrind: false
          - target: x64musl
            os: ubuntu-24.04
            valgrind: true
          - target: arm64musl
            os: ubuntu-24.04-arm
            valgrind: false
          - target: x64win
            os: windows-2025
            valgrind: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.target == 'x64win' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The spec runner is a Roc script, and it builds its Rust helper.
      - uses: niclas-ahden/roc-builds@065946819a3c3aafefd5974b9109adeecbad8106 # v1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Install Valgrind
        if: matrix.valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Download native example binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}
      - name: Run native spec cases
        if: matrix.valgrind == false
        shell: bash
        run: roc scripts/test.roc --operation run --target "${{ matrix.target }}" --artifact-dir dist/example-binaries
      - name: Run native spec cases with Valgrind
        if: matrix.valgrind
        shell: bash
        run: roc scripts/test.roc --operation run --target "${{ matrix.target }}" --artifact-dir dist/example-binaries --valgrind

      - name: Stop a real systemd service and verify application cleanup
        if: matrix.target == 'x64musl' || matrix.target == 'arm64musl'
        # The script runs systemd-run and systemctl through sudo itself.
        run: roc scripts/test_systemd_cleanup.roc dist/example-binaries/${{ matrix.target }}/signal-cleanup
