name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run daily at 11 AM UTC, after the nightlies are typically published.
    - cron: '0 11 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  rust-version:
    name: read Rust version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The host has substantial per-OS code, so lint and test it on each one.
  rust:
    name: Rust format, lint, and test (${{ matrix.os }})
    needs: rust-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run host unit tests
        run: cargo test --locked --all-targets

  validate:
    name: validate sources
    needs: rust-version
    runs-on: ubuntu-24.04
    # Generous enough to build the pinned Roc on a cold cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-roc-pinned
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target x86_64-unknown-linux-musl --component llvm-tools-preview
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Test release tooling
        run: python3 -m unittest scripts/test_check_release_version.py scripts/test_check_release_branch.py scripts/test_check_version_bump.py scripts/test_update_nix_release.py scripts/test_check_roc_pin.py scripts/test_windows_runtime.py scripts/test_third_party_notices.py
      - name: Check third-party notices are current
        run: python3 scripts/third_party_notices.py --check
      - name: Check Roc pins are in sync
        run: python3 scripts/check_roc_pin.py
      - name: Check OS witness API boundaries
        run: python3 scripts/test_system_api.py
      - name: Format, check, and test examples
        run: ./scripts/test.py --operation validate
      - name: Check musl allocator syscall churn
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          python3 scripts/test_musl_allocator.py
      - name: Check native resource ownership with glibc and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          python3 scripts/test_resource_lifetimes.py

  validate-windows:
    name: validate sources (windows)
    needs: rust-version
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-roc-pinned
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target x86_64-pc-windows-msvc --component rust-docs,llvm-tools-preview
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Format, check, and test examples
        shell: bash
        run: ./scripts/test.py --operation validate
      - name: Verify Windows runtime ABI and redistribution evidence
        shell: bash
        run: python -m unittest scripts/test_windows_runtime.py

  build-examples:
    name: build examples (${{ matrix.target }})
    needs: [rust-version, validate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-26-intel
            rust_target: x86_64-apple-darwin
          - target: arm64mac
            os: macos-26
            rust_target: aarch64-apple-darwin
          - target: x64musl
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - target: arm64musl
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: x64win
            os: windows-2025
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-roc-pinned
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target ${{ matrix.rust_target }} --component rust-docs,llvm-tools-preview
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Install LLVM tools for Linux host stripping
        if: endsWith(matrix.target, 'musl')
        run: rustup component add llvm-tools-preview
      - name: Cross-compile every example
        shell: bash
        run: ./scripts/test.py --operation build --target "${{ matrix.target }}" --artifact-dir dist/example-binaries
      - name: Upload example binaries
        uses: actions/upload-artifact@v7
        with:
          name: example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}
          if-no-files-found: error

  run-examples:
    name: run examples (${{ matrix.target }})
    needs: [rust-version, build-examples]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-26-intel
            valgrind: false
          - target: arm64mac
            os: macos-26
            valgrind: false
          - target: x64musl
            os: ubuntu-24.04
            valgrind: true
          - target: arm64musl
            os: ubuntu-24.04-arm
            valgrind: false
          - target: x64win
            os: windows-2025
            valgrind: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ needs.rust-version.outputs.version }}"
      - name: Install Valgrind
        if: matrix.valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Download native example binaries
        uses: actions/download-artifact@v8
        with:
          name: example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}
      - name: Run native spec cases
        if: matrix.valgrind == false
        shell: bash
        run: ./scripts/test.py --operation run --target "${{ matrix.target }}" --artifact-dir dist/example-binaries
      - name: Run native spec cases with Valgrind
        if: matrix.valgrind
        shell: bash
        run: ./scripts/test.py --operation run --target "${{ matrix.target }}" --artifact-dir dist/example-binaries --valgrind

      - name: Stop a real systemd service and verify application cleanup
        if: matrix.target == 'x64musl' || matrix.target == 'arm64musl'
        run: sudo python3 scripts/test_systemd_cleanup.py dist/example-binaries/${{ matrix.target }}/signal-cleanup
