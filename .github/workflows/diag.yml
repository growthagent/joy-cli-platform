name: Diagnose

# A temporary look at Roc's string splitting on macOS Intel.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  look:
    name: Look (${{ matrix.os }}, ${{ matrix.roc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, roc: main-90f1d6d }
          - { os: macos-15-intel, roc: nightly-a520eed }
          - { os: macos-15-intel, roc: pinned-165a1ba }
          - { os: macos-15, roc: main-90f1d6d }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Roc's main
        if: matrix.roc == 'main-90f1d6d'
        uses: niclas-ahden/roc-builds@7aeb0a90f91897cf074e3b0e6bac6211734c9abe # v1
        with:
          commit: 90f1d6d6aedc64e08a9741220a1fb8c6e0d902b4
      - name: The pinned compiler
        if: matrix.roc == 'pinned-165a1ba'
        uses: niclas-ahden/roc-builds@7aeb0a90f91897cf074e3b0e6bac6211734c9abe # v1
        with:
          commit: 165a1baad4971048167702feedbca344ca93ecfc
      - name: The nightly
        if: matrix.roc == 'nightly-a520eed'
        run: |
          curl -fsSL -o roc.tar.gz https://github.com/roc-lang/nightlies/releases/download/nightly-2026-11-18-a520eed/roc_nightly-macos_x86_64-2026-11-18-a520eed.tar.gz
          mkdir nightly && tar -xzf roc.tar.gz -C nightly --strip-components=1
          echo "$PWD/nightly" >> "$GITHUB_PATH"
      - name: The machine
        run: |
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          roc version
      - name: The minimal file in every mode
        if: always()
        working-directory: split
        env:
          INPUT: |-
            key: a value that is long enough to show it
            key: a value of thirty-three bytes
            key: a value of thirty-two bytes
            key: short
        run: ./modes.sh repro.roc
      - name: The probe, run
        if: always()
        working-directory: split
        run: roc probe.roc
      - name: The probe, built first
        if: always()
        working-directory: split
        run: roc build --output=probe-built probe.roc && ./probe-built
